services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: seo_saas_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seo_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: pgvector/pgvector:pg16
    container_name: seo_saas_postgres_test
    restart: "no"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seo_saas_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seo_saas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: seo_saas_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Default CMD do Dockerfile (/app/start.sh) ja roda alembic + uvicorn.

# Em prod paga (Render starter+) o worker vira servico separado.
# No free, o ARQ roda como subprocess dentro do servico `backend` (ver start.sh).
# Para testar local com worker separado, descomentar abaixo.
#  worker:
#    build:
#      context: .
#      dockerfile: backend/Dockerfile
#    container_name: seo_saas_worker
#    restart: unless-stopped
#    env_file:
#      - backend/.env
#    volumes:
#      - uploads_data:/app/uploads
#    depends_on:
#      postgres:
#        condition: service_healthy
#      redis:
#        condition: service_healthy
#    command: ["python", "-m", "arq", "app.worker.WorkerSettings"]

volumes:
  postgres_data:
  redis_data:
  uploads_data:
