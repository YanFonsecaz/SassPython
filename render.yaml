# Render Blueprint — TIER FREE (testes/demo)
# Postgres: Supabase (externo, free, nao expira) — DATABASE_URL preenchida manualmente.
# Redis/KV: Render free (25MB).
# Web: Render free Docker (512MB RAM, spin-down apos 15min).
# Worker: roda como subprocess do web (start.sh) ja que free nao tem Background Worker.
# Uploads: /app/uploads ephemeral (sem Disk no free).
#
# Para producao: trocar plans para starter+, mover worker para servico separado,
# adicionar bloco `disk` no web e worker.

services:
  - type: keyvalue
    name: seo-saas-redis
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: seo-saas-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Ambiente ---
      - key: AMBIENTE
        value: producao
      - key: LOG_LEVEL
        value: INFO

      # --- Banco (Supabase) ---
      # Pegar em Supabase Dashboard > Settings > Database > Connection string > URI
      # Formato esperado:
      #   postgresql+asyncpg://postgres.<projeto>:<senha>@<host>:5432/postgres
      # ATENCAO: trocar `postgresql://` por `postgresql+asyncpg://` no inicio.
      # Usar a connection string da "Session pooler" (porta 5432) ou direct connection.
      - key: DATABASE_URL
        sync: false

      # --- Redis (Render KV interno) ---
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: seo-saas-redis
          property: connectionString

      # --- Secrets gerados automaticamente ---
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # --- JWT ---
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRES
        value: "900"
      - key: JWT_REFRESH_TOKEN_EXPIRES
        value: "604800"

      # --- URLs (preencher apos primeiro deploy gerar o hostname) ---
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # --- LLM ---
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: ZHIPUAI_API_KEY
        sync: false
      - key: INSERIDOR_LLM_MODEL
        value: gpt-4.1
      - key: RERANKER_LLM_MODEL
        value: gpt-4.1
      - key: REVISOR_LLM_MODEL
        value: gpt-4.1
      - key: ENRIQUECEDOR_LLM_MODEL
        value: gpt-4.1
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1024"
      - key: IMAGEM_MODEL
        value: gpt-image-1

      # --- Pesquisa externa ---
      - key: SERPAPI_KEY
        sync: false
      - key: GOOGLE_TRENDS_ENABLED
        value: "false"

      # --- Workflows ---
      - key: WORKFLOW_TIMEOUT_SEGUNDOS
        value: "600"
      - key: WORKFLOW_DISTRIBUIR_INLINKS_TIMEOUT
        value: "1800"

      # --- ARQ (rodando no mesmo container do web) ---
      # No free de 512MB precisamos limitar muito pra nao OOM.
      - key: ARQ_MAX_JOBS
        value: "3"
      - key: ARQ_JOB_TIMEOUT
        value: "2400"

      # --- Seguranca ---
      - key: HIBP_FAIL_MODE
        value: open

      # --- Observabilidade (opcional) ---
      - key: SENTRY_DSN
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: seo-saas

      # --- Uploads ephemeral (free nao tem disk) ---
      - key: UPLOADS_DIR
        value: /app/uploads
