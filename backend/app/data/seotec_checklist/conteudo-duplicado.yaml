  peso: 8
  prioridade: high
  implementacao: obrigatoria
  responsavel:
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: Queremos garantir que o site tenha selecionado uma versão para exibir ao vivo em um navegador.
