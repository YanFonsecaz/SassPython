- slug: varias-urls-canonical
  nome: Várias URLs Canonical
  peso: 9
  prioridade: very-high
  implementacao: obrigatoria
  responsavel:
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: Tag canonical é utilizada para direcionar os mecanismos de busca que uma página é identica
    a outra. Utilizar mais de uma tag canonical por página não é recomendado, pois a lógica da tag é apontar
    apenas uma url por página.
  importancia: Várias tags rel="canonical" com diferentes URLs especificadas para a mesma página confundem
    os mecanismos de pesquisa, tornando quase impossível identificar qual URL se refere à verdadeira página
    canônica. Como resultado, os mecanismos de pesquisa provavelmente vão ignorar todos os elementos canônicos
    ou selecionar o errado. Por isso, é recomendável que você especifique no máximo uma rel="canonical"
    para uma página.
  regra:
    export: canonicals
    tipo: contagem
    filtro:
      campo: multiplas
      op: igual
      valor: true
  evidencia:
    colunas:
    - address
    - canonical
