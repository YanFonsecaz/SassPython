- slug: http-vs-https
  nome: http vs. https
  peso: 10
  prioridade: very-high
  implementacao: obrigatoria
  responsavel:
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: Queremos verificar se o site tem uma versão segura, além de verificar que não existem páginas
