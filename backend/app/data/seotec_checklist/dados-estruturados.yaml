categoria: Dados Estruturados
itens:
- slug: uso-de-markup-de-dados-estruturados
  nome: Uso de markup de Dados Estruturados
  peso: 9
  prioridade: very-high
  implementacao: bom-ter
  responsavel:
  - dev
  - marketing
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: 'Um snippet de código (HTML) localizado na tag  <header> que informa aos motores de busca
    sobre o que é a sua página.


    Esses markups vêm em formatos diferentes (negócio local, vídeo etc) e devem ser usados segundo o seu
    site e o seu tipo de conteúdo.'
  importancia: 'Em 2019, o Google fez disso um Fator de Posicionamento.


    Ele facilita para o Googlebot chegar à essência do tema da sua página sem ter que ler códigos complexos.


    Para avaliações de produtos, ter um bom snipper aparecendo nos SERPs com estrelas de avaliação, o
    que aumenta muito a taxa de cliques.'
