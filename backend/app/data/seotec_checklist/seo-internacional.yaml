categoria: SEO Internacional
itens:
- slug: uso-do-atributo-lang-html-lang-pt-br-html
  nome: Uso do atributo lang (<html lang="pt-BR">...</html>)
  peso: 10
  prioridade: very-high
  implementacao: obrigatoria
  responsavel:
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: Sinaliza ao Google que idioma está sendo usado em uma página.
  importancia: 'Independente de você ter conteúdo em diferentes idiomas em seu site, você deve sinalizar
    ao Google qual o idioma original da páina.


    Mas caso haja tradução, deve também garantir que a página apropriada seja servida ao usuário de pesquisa,
    de acordo com a língua que ele está usando.


    Os resultados serão servidos segundo a localização.


    Ex.: páginas em espanhol com tag <html lang="es-ES"> serão servidas a endereços de IP em países que
    falam espanhol.'
  regra:
    export: extracoes
    tipo: contagem
    filtro:
      campo: lang
      op: vazio
  evidencia:
    colunas:
    - address
    - lang
- slug: diretiva-de-idioma-alternativo-hreflang-no-cabecalho-do-codigo-fonte
  nome: Diretiva de idioma alternativo HREFLANG no cabeçalho do Código Fonte
  peso: 9
  prioridade: very-high
  implementacao: obrigatoria
  responsavel:
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: 'Sinaliza ao Google que idioma está sendo usado em uma página.


    Precisamos sempre garantir que essa tag seja colocada dentro da <head> do código-fonte de um site.'
  importancia: 'Se você tem conteúdo em diferentes idiomas em seu site, você deve garantir que a página
    apropriada seja servida ao usuário de pesquisa, de acordo com a língua que ele está usando.


    Os resultados serão servidos segundo a localização.


    Ex.: páginas em espanhol com hreflang=es serão servidas a endereços de IP em países que falam espanhol.'
  regra:
    export: hreflang
    tipo: existencia
    campo: address
    na_se_export_vazio: true
  evidencia:
    colunas:
    - address
- slug: uso-de-urls-hreflang-com-codigo-de-status-200
  nome: Uso de URLs hreflang com código de status 200
  peso: 9
  prioridade: very-high
  implementacao: obrigatoria
  responsavel:
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: URLs contidas nas anotações hreflang rel=”alternate” que não têm um código de resposta 200,
    como URLs bloqueados por robots.txt, sem respostas, 3XX (redirecionamentos), 4XX (erros do cliente)
    ou 5XX (erros de servidor).
  importancia: As URLs hreflang devem ser rastreáveis ​​e indexáveis ​​e, portanto, as URLs não 200 são
    tratados como erros e ignoradas pelos mecanismos de pesquisa.
  regra:
    export: hreflang
    tipo: contagem
    filtro:
      campo: problema
      op: igual
      valor: url_nao_200
    na_se_export_vazio: true
  evidencia:
    colunas:
    - address
    - problema
- slug: urls-hreflang-nao-vinculadas
  nome: URLs Hreflang não vinculadas
  peso: 9
  prioridade: very-high
  implementacao: obrigatoria
  responsavel:
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: Páginas que contêm uma ou mais URLs hreflang que só podem ser descobertas por meio de suas
    anotações de link hreflang rel=”alternate”.
  importancia: As anotações hreflang não passam no PageRank como uma tag âncora tradicional, então isso
    pode ser um sinal de um problema com links internos ou com os URLs contidos na anotação hreflang.
    Se hreflang estiver configurado em vários domínios e você estiver rastreando apenas um único domínio,
    isso será sinalizado. Considere usar o recurso CDNs para rastrear vários domínios neste cenário.
  regra:
    export: hreflang
    tipo: contagem
    filtro:
      campo: problema
      op: igual
      valor: nao_vinculada
    na_se_export_vazio: true
  evidencia:
    colunas:
    - address
    - problema
- slug: links-de-retorno-ausentes
  nome: Links de retorno ausentes
  peso: 9
  prioridade: very-high
  implementacao: obrigatoria
  responsavel:
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: Hreflang é recíproco, portanto, todas as versões alternativas devem confirmar o relacionamento.
    Quando a página X se vincula à página Y usando hreflang para especificá-la como página alternativa,
    a página Y deve ter um link de retorno.
  importancia: Nenhum link de retorno especificado significa que as anotações hreflang podem ser ignoradas
    ou não interpretadas corretamente.
  regra:
    export: hreflang
    tipo: contagem
    filtro:
      campo: problema
      op: igual
      valor: retorno_ausente
    na_se_export_vazio: true
  evidencia:
