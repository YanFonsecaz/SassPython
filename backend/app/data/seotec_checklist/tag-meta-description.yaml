- slug: multiplas-meta-descriptions
  nome: Múltiplas meta descriptions
  peso: 3
  prioridade: low
  implementacao: bom-ter
  responsavel:
  - marketing
  impacto:
    direto: false
    indireto: true
  fonte: sf
  descricao: Qualquer página que tenha várias meta descrições.
  importancia: Deve haver apenas uma única meta descrição para uma página. Múltiplas meta descrições são
    freqüentemente causadas por vários plug-ins ou módulos conflitantes no CMS e podem confundir mecanismos
    de pesquisa como o Google.
