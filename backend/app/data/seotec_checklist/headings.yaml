- slug: heading-h1-acima-da-dobra
  nome: Heading H1 acima da dobra
  peso: 5
  prioridade: medium
  implementacao: bom-ter
  responsavel:
  - dev
  impacto:
    direto: false
    indireto: false
  fonte: manual
  descricao: Essencialmente, só de ter uma tag H1 em suas páginas, você está ajudando seu site a posicionar
    melhor. Tags H1 podem não ser a coisa mais eficaz que você pode fazer para a otimização para motores
    de busca, mas ainda assim são muito importantes para o SEO, porque dizem tanto aos motores de busca
    quanto aos visitantes do site qual será o tema das páginas.
  importancia: "Acima da dobra é o termo utilizado para a parte superior da página, onde você não precisa\
    \ rolar para baixo. Em termos simples, a seção acima da dobra é da altura da tela, a primeira parte\
    \ que você vê ao chegar à página. \n\nNessa primeira parte você precisa colcoar seus elementos mais\
    \ interessantes, como o seu H1."
- slug: multiplas-tags-h1-no-codigo
  nome: Múltiplas tags H1 no Código
  peso: 8
  prioridade: high
  implementacao: obrigatoria
  responsavel:
  - marketing
  - dev
  impacto:
    direto: false
    indireto: false
  fonte: sf
  descricao: 'É uma melhor prática de Seo  ter apenas uma tag H1 tag or página.


    Se você precisa de mais tags de cabeçalho, utilize tags H2, H3 e H4.'
  importancia: 'Informa aos mecanismos de pesquisa sobre conteúdos importantes na página.


    Um bom lugar para colocar palavras-chave LSI, diferentes da palavra-chave principal na title tag.'
  regra:
    export: h1
    tipo: limiar
    filtro:
      campo: ocorrencias
      op: maior
      valor: 1
  evidencia:
    colunas:
    - address
    - ocorrencias
- slug: hierarquia-de-heading-tags
  nome: Hierarquia de Heading Tags
  peso: 8
  prioridade: high
  implementacao: bom-ter
  responsavel:
  - marketing
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: As heading tags foram criadas com o objetivo de exibir de forma hierarquica o conteúdo de
    um site. O h1 sempre irá representar o assunto principal daquela página, o h2 o assunto de segunda
    maior importância o h3 de terceira e assim por diante até o h6. Ter uma hierarquia bem estruturada
    ajudará na performance de SEO, já que indica aos mecanismos de busca do que aquela página trata, dando
    maior relevância ou não para cada conteúdo/keyword.
  importancia: É importante seguir uma hierarquia das heading tags com o objetivo de melhorar a performance
    do SEO de uma página. Quando falamos de hierarquia, é tanto em relação ao assunto quanto em posicionamento
    da tag dentro da página. Ter uma tag <h1> (representa o assunto mais importante) posicionada no meio
    ou final da página não é recomendado. O mesmo vale em ter uma tag <h6> (menor nível hierarquico das
    heading tag) posicionada no topo da página. É importante entender que não é necessário utilizar todos
    os níveis de heading tags caso não seja necessário, além de sempre utilizar apenas um <h1> por página.
  regra:
    export: h1
    tipo: custom
    funcao: hierarquia_headings
  evidencia:
    colunas:
    - address
