categoria: Headings da Página (H1-H6)
itens:
- slug: tag-h1-ausente-ou-vazia
  nome: Tag H1 ausente ou vazia
  peso: 7
  prioridade: high
  implementacao: obrigatoria
  responsavel:
  - marketing
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: 'Tags <h1> geralmente são encontradas no topo da página e exibem o cabeçalho da página (podendo
    ser diferentes da title tag).


    Deve haver apenas uma tag H1 em cada página.'
  importancia: 'Informa aos mecanismos de pesquisa sobre conteúdos importantes na página.


    Um bom lugar para colocar palavras-chave LSI, diferentes da palavra-chave principal na title tag.'
  regra:
    export: h1
    tipo: contagem
    filtro:
      campo: h1
      op: vazio
  evidencia:
    colunas:
    - address
    - h1
