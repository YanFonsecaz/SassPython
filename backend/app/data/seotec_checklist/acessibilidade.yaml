  regra:
    export: response_codes
    tipo: contagem
    filtro:
      campo: status_code
      op: entre
      valor:
      - 500
      - 599
  evidencia:
    colunas:
    - address
    - status_code
- slug: pagina-orfa-sem-links-internos-recebidos
  nome: Página órfã (sem links internos recebidos)
  peso: 7
  prioridade: high
  implementacao: bom-ter
  responsavel:
  - dev
  - marketing
  impacto:
    direto: false
    indireto: true
  fonte: sf
  descricao: As páginas órfãs de um site não têm links recebidos internos.
  importancia: Rastreadores de motores de busca só podem descobrir essas páginas a partir do arquivo de
    sitemap ou de backlinks externos. Visitantes do site não poderão acessar essa página de qualquer outra
    página em seu site.
  regra:
    export: orfas
    tipo: contagem
    filtro:
      campo: address
      op: nao_vazio
    atencao_max: 10
  evidencia:
    colunas:
    - address
    - origem
