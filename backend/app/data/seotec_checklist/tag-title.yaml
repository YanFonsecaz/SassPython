- slug: titulo-longo-demais-mais-de-63-caracteres
  nome: Título longo demais - mais de 63 caracteres
  peso: 5
  prioridade: medium
  implementacao: bom-ter
  responsavel:
  - marketing
  impacto:
    direto: false
    indireto: false
  fonte: sf
  descricao: 'É melhor estruturar o título da sua página incluindo suas palavras-chave principais.


    Você precisa usar um título de página com até 65 caracteres. Mais do que isso e ele será truncado
    pelo Google.'
  importancia: 'Title tags são ESSENCIAIS em fatores de posicionamento nos rankings.


    Elas atraem o máximo de atenção do usuário nos SERPs, com texto maior e destaque em azul.


    Todas as suas páginas devem ter title tags, sem duplicatas.'
  regra:
    export: page_titles
    tipo: limiar
    filtro:
      campo: title_length
      op: maior
      valor: 63
    atencao_max: 5
  evidencia:
    colunas:
    - address
    - title
    - title_length
