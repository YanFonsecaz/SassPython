categoria: Tag <title>
itens:
- slug: title-tag-ausente-ou-vazia
  nome: Title tag ausente ou vazia
  peso: 10
  prioridade: very-high
  implementacao: obrigatoria
  responsavel:
  - marketing
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: 'A title tag das suas páginas.


    Ela precisa estar localizada dentro das tags <head> do código da página.


    Isso deve estar escrito tanto para benefícios de SEO como para provocar cliques da parte do usuário.'
  importancia: 'Title tags são ESSENCIAIS em fatores de posicionamento nos rankings.


    Elas atraem o máximo de atenção do usuário nos SERPs, com texto maior e destaque em azul.


    Todas as suas páginas devem ter title tags, sem duplicatas.'
  regra:
    export: page_titles
    tipo: contagem
    filtro:
      campo: title
      op: vazio
  evidencia:
    colunas:
    - address
    - title
