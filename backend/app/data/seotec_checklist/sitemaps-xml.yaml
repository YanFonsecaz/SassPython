categoria: Sitemaps XML da Página
itens:
- slug: site-tem-sitemap-xml
  nome: Site tem Sitemap XML?
  peso: 9
  prioridade: very-high
  implementacao: obrigatoria
  responsavel:
  - dev
  impacto:
    direto: true
    indireto: false
  fonte: sf
  descricao: Um arquivo XML que ajuda mecanismos de busca a rastrear e entender melhor o seu site.
  importancia: 'Eles ajudam a melhorar a indexação do seu site.


    Você pode definir um "orçamento de rastreio", ou seja, a importância de cada página/tipo de página
    em seu site. Isso é especialmente importante para sites muito grandes (mais de 10 mil páginas) que
    querem dar preferência a certos conjuntos de páginas para o tempo de rastreio.'
  regra:
    export: sitemaps
    tipo: existencia
    campo: total_urls
  evidencia:
    colunas:
    - sitemap_url
    - total_urls
    - status_code
