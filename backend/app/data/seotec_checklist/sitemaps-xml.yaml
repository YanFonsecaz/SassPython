  descricao: Você tem páginas quebradas que estão no seu sitemap.
  importancia: Motores de busca usam arquivos de sitemap XML como um sinal de que páginas precisam ser
    rastreadas. Ter arquivos de sitemap bem organizados, limpos e otimizados é essencial para sites grandes,
    ou que contêm vídeos, imagens e/ou notícias.
