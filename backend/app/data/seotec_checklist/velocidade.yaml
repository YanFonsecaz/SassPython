  fonte: manual
  descricao: Esse relatório apresenta um resumo da experiência do usuário que visita seu site. O Google
    avalia as métricas de experiência na página de URLs individuais no site e as usa como indicador de
    classificação para o URL nos resultados da Pesquisa Google.
  importancia: 'A experiência na página é avaliada por URL. A avaliação e o relatório foram desenvolvidos
    para ajudar os sites a criar páginas que proporcionem uma melhor experiência do usuário aos visitantes.


    A experiência na página na Pesquisa Google é avaliada com base nos seguintes critérios:

    1) Principais métricas da Web (Core WebVitals: LCP, FID e CLS)

    2) Usabilidade em dispositivos móveis

    3) Uso de HTTPS'
