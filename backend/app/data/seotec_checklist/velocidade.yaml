categoria: Velocidade da Página
itens:
- slug: paginas-lentas
  nome: Páginas lentas
  peso: 7
  prioridade: high
  implementacao: obrigatoria
  responsavel:
  - dev
  impacto:
    direto: false
    indireto: true
  fonte: sf
  descricao: Páginas em seu site em que o código HTML levou muito tempo para carregar.
  importancia: 'A velocidade de carregamento de uma página é um dos fatores de ranqueamento no Google.

    Além disso, a velocidade da página afeta a experiência do usuário em seu site. Visitantes muitas vezes
    não esperam muito enquanto a página carrega e fazem "bounce."


    Verifique se o código HTML está otimizado em todas as suas páginas. Se esse problema persistir, considere
    mudar seu site para um servidor mais rápido.'
  regra:
    export: internal
    tipo: limiar
    filtro:
      campo: response_time
      op: maior
      valor: 1.0
    atencao_max: 10
  evidencia:
    colunas:
    - address
    - response_time
