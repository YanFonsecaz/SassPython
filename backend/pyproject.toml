[project]
name = "seo-saas"
version = "0.1.0"
description = "SaaS SEO com IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "pyotp>=2.9.0",
    "cryptography>=44.0.0",
    "segno>=1.6.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    # aiosqlite[dev]>=0.22.1,  # Removido - PostgreSQL usado em vez de SQLite
    "zxcvbn>=4.5.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "zhipuai>=2.0.0",
    "pgvector>=0.3.0",
    "google-search-results>=2.4.0",
    "pytrends>=4.9.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0",
    "trafilatura>=2.0.0",
    "selectolax>=0.4.0",
    "tiktoken>=0.12.0",
    "prometheus-client>=0.21.0",
    "langsmith>=0.1.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "respx>=0.23.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
# N818: convenção PT-BR usa "Erro*" sem sufixo "Error"
# B008: FastAPI/SQLAlchemy depende de Depends()/Column() em defaults
# E501: line-length controlled separately
ignore = ["E501", "B008", "N818"]

[tool.mypy]
python_version = "3.12"
# Gradual typing: comece relaxado e suba a régua conforme os modulos forem tipados
strict = false
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
ignore_missing_imports = true  # bibliotecas sem stubs (trafilatura, pytrends, etc.)

# Modulos que ja podem rodar em strict
[[tool.mypy.overrides]]
module = ["app.config", "app.core.seguranca", "app.core.rate_limit", "app.core.user_cache"]
strict = true

# Models: forward references entre models geram name-defined intencionalmente
[[tool.mypy.overrides]]
module = "app.models.*"
disable_error_code = ["name-defined"]
